<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Silika Bites</title>
    <link rel="icon" href="img/favicon-16x16.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: white;
            padding: 2rem;
            border-radius: 0.5rem;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }
        .close-modal {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 1.5rem;
            cursor: pointer;
            background: none;
            border: none;
        }
        
        /* Time badge alignment */
        .badge {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.5rem 1rem;
        }
    </style>
</head>
<body class="text-gray-500 font-body">

                <div>
                    <ul class="hidden mt-6 text-sm md:block" id="menu">
                        <li class="py-1 font-bold text-gray-700">
                            <a href="#" class="flex justify-end px-4 border-r-4 border-primary">
                                <span>Home</span>
                                <svg class="w-5 ml-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">

                                  </svg>
                            </a>

                        <li class="py-1">
                            <a href="contact.html" class="flex justify-end px-4 border-r-4 border-white">

                                    <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
                                  </svg>
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>
        </div><!--End nav-->

        <main class="px-16 py-6 bg-gray-100 md:col-span-2">
            <div class="flex justify-center md:justify-end">
                <a href="#" class="transition duration-500 ease-out btn text-primary border-primary md:border-2 hover:bg-primary hover:text-white">Log In</a>
                <a href="#" class="ml-2 transition duration-500 ease-out btn text-primary border-primary md:border-2 hover:bg-primary hover:text-white">Sign Up</a>
            </div>

            <header>
                <h2 id="heading" class="text-6xl font-semibold text-gray-700">Recipes</h2>
                <h3 id="subheading" class="text-2xl font-semibold">For Silika Bites</h3>
            </header>

            <div>
                <h4 id="latest-recipes" class="pb-2 mt-12 font-bold border-b border-gray-200">Latest Recipes</h4>

                <div class="grid gap-10 mt-8 lg:grid-cols-3">
                    <!-- Recipe Cards -->
                    <div class="cursor-pointer card hover:shadow-lg recipe-card" data-recipe="5 Bean Chilli Stew" data-author="Abdulrahman" data-time="25 mins">
                        <img src="img/stewv.jfif" alt="stew" class="object-cover w-full h-32 sm:h-48">
                        <div class="m-4">
                            <span class="font-bold">5 Bean Chilli Stew</span>
                            <span class="block text-sm text-gray-500">Recipe by Abdulrahman</span>
                        </div>
                        <div class="badge">
                            <svg class="w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />

                    <div class="cursor-pointer card hover:shadow-lg recipe-card" data-recipe="Veg Noodles" data-author="Salman" data-time="20 mins">
                        <img src="img/noodlesv.jfif" alt="noodles" class="object-cover w-full h-32 sm:h-48">
                        <div class="m-4">
                            <span class="font-bold">Veg Noodles</span>
                            <span class="block text-sm text-gray-500">Recipe by Salman</span>
                        </div>
                        <div class="badge">
                            <svg class="w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                            </svg>
                            <span>20 mins</span>
                        </div>
                    </div>

                    <div class="cursor-pointer card hover:shadow-lg recipe-card" data-recipe="Tofu Curry" data-author="Twaha" data-time="25 mins">
                        <img src="img/curryv.jfif" alt="curry" class="object-cover w-full h-32 sm:h-48">
                        <div class="m-4">
                            <span class="font-bold">Tofu Curry</span>
                            <span class="block text-sm text-gray-500">Recipe by Twaha</span>
                        </div>
                        <div class="badge">
                            <svg class="w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                            </svg>
                            <span>25 mins</span>
                        </div>
                    </div>
                </div>

                <h4 id="most-popular" class="pb-2 mt-12 font-bold border-b border-gray-200">Most Popular</h4>

                <div class="mt-8">
                    <!--Cards go here-->
                </div>

                <div class="flex justify-center">
                    <div id="load-more" class="transition ease-out transform btn bg-secondary-100 text-secondary-200 hover:shadow-inner hover:scale-110 hover:opacity-50 hover:duration-300">Load More</div>
                </div>
            </div>
        </main>
    </div>

    <!-- Recipe Modal -->
    <div id="recipeModal" class="modal">
        <div class="modal-content">
            <button class="close-modal">&times;</button>
            <div id="modalRecipeContent"></div>
        </div>
    </div>
     
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js';
        
        const firebaseConfig = {
            apiKey: "AIzaSyDSFxLr_XUtbV5b1EwnIE37QUgU5otC6N8",
            authDomain: "silika-bites.firebaseapp.com",
            projectId: "silika-bites",
            storageBucket: "silika-bites.appspot.com",
            messagingSenderId: "841551984440",
            appId: "1:841551984440:web:9702d7b843ece31ac6b3cd",
            measurementId: "G-6Q1YKJT5QB"
        };

        const app = initializeApp(firebaseConfig);
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Mobile menu toggle
            const burger = document.querySelector('#burger');
            const menu = document.querySelector('#menu');
            
            if (burger && menu) {
                burger.addEventListener('click', () => {
                    menu.classList.toggle('hidden');
                });
            }

            // Recipe data
            const recipes = {
                "5 Bean Chilli Stew": {
                    ingredients: ["Beans", "Tomatoes", "Onions", "Garlic", "Spices"],
                    instructions: "1. Sauté onions and garlic. 2. Add tomatoes and spices. 3. Stir in beans and simmer for 20 minutes."
                },
                "Veg Noodles": {
                    ingredients: ["Noodles", "Bell Peppers", "Carrots", "Soy Sauce", "Garlic"],
                    instructions: "1. Cook noodles according to package. 2. Stir-fry vegetables. 3. Add noodles and sauce, toss to combine."
                },
                "Tofu Curry": {
                    ingredients: ["Tofu", "Coconut Milk", "Curry Paste", "Vegetables", "Rice"],
                    instructions: "1. Press and cube tofu. 2. Sauté curry paste. 3. Add coconut milk and simmer with tofu and vegetables."
                }
            };

            // Recipe modal functionality
            const recipeModal = document.getElementById('recipeModal');
            const modalRecipeContent = document.getElementById('modalRecipeContent');
            const closeModal = document.querySelector('.close-modal');
            const recipeCards = document.querySelectorAll('.recipe-card');

            recipeCards.forEach(card => {
                card.addEventListener('click', function() {
                    const recipeName = this.getAttribute('data-recipe');
                    const author = this.getAttribute('data-author');
                    const time = this.getAttribute('data-time');
                    const recipe = recipes[recipeName];
                    
                    modalRecipeContent.innerHTML = `
                        <h3 class="text-2xl font-bold">${recipeName}</h3>
                        <p class="mt-2 text-gray-500">Recipe by ${author} • ${time}</p>
                        
                        <div class="mt-6">
                            <h4 class="text-xl font-semibold">Ingredients:</h4>
                            <ul class="mt-2 list-disc list-inside">
                                ${recipe.ingredients.map(ing => `<li>${ing}</li>`).join('')}
                            </ul>
                        </div>
                        
                        <div class="mt-6">
                            <h4 class="text-xl font-semibold">Instructions:</h4>
                            <p class="mt-2 whitespace-pre-line">${recipe.instructions}</p>
                        </div>
                    `;
                    
                    recipeModal.style.display = 'flex';
                });
            });

            closeModal.addEventListener('click', function() {
                recipeModal.style.display = 'none';
            });

            window.addEventListener('click', function(event) {
                if (event.target === recipeModal) {
                    recipeModal.style.display = 'none';
                }
            });

            // Translations
            const translations = {
                en: {
                    heading: "Recipes",
                    subheading: "For Silika",
                    latestRecipes: "Latest Recipes",
                    mostPopular: "Most Popular",
                    loadMore: "Load More",
                    chefProfileHeading: "Chef Abdulrahman",
                    chefBio: "With over 10 years of culinary experience, Chef Abdulrahman is known for his innovative takes on traditional dishes."
                },
                fr: {
                    heading: "Recettes",
                    subheading: "Pour Silika",
                    latestRecipes: "Dernières Recettes",
                    mostPopular: "Les Plus Populaires",
                    loadMore: "Charger Plus",
                    chefProfileHeading: "Chef Abdulrahman",
                    chefBio: "Avec plus de 10 ans d'expérience culinaire, le Chef Abdulrahman est connu pour ses approches innovantes des plats traditionnels."
                },
                es: {
                    heading: "Recetas",
                    subheading: "Para Silka",
                    latestRecipes: "Últimas Recetas",
                    mostPopular: "Más Populares",
                    loadMore: "Cargar Más",
                    chefProfileHeading: "Chef Abdulrahman",
                    chefBio: "Con más de 10 años de experiencia culinaria, el Chef Abdulrahman es conocido por sus enfoques innovadores en platos tradicionales."
                }
            };

            // Language selector
            const languageSelect = document.getElementById('language-select');
            if (languageSelect) {
                languageSelect.addEventListener('change', function() {
                    updateContent(this.value);
                });
            }

            function updateContent(language) {
                const translation = translations[language] || translations.en;
                document.getElementById('heading').textContent = translation.heading;
                document.getElementById('subheading').textContent = translation.subheading;
                document.getElementById('latest-recipes').textContent = translation.latestRecipes;
                document.getElementById('most-popular').textContent = translation.mostPopular;
                document.getElementById('load-more').textContent = translation.loadMore;
            }

            // Initialize with English
            updateContent('en');
        });
    </script>
</body>
</html>
